<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partida · Baguga's</title><link rel="stylesheet" href="css/geral.css"><link rel="stylesheet" href="css/jogo.css"></head>
<body><main class="game-app">
<header class="game-header"><div class="brand-mini"><a href="index.html" class="brand"><span class="brand-mark"><span>♠</span><span>♥</span><span>♦</span><span>♣</span></span><span><b>Baguga's</b><small>Card Games</small></span></a></div><div class="match-title"><span class="eyebrow">PARTIDA</span><strong id="nomeJogo">Carregando…</strong></div><div class="match-tools"><span class="room-small">SALA <b id="codigoSala">-----</b></span><button id="btnTutorial" class="circle-button" title="Como jogar">?</button><button id="btnSair" class="btn btn-secondary small">Sair</button></div></header>
<div id="tutorialJogo" class="tutorial-overlay escondido"><section class="tutorial-panel"><button id="fecharTutorial" class="close-button">×</button><span class="eyebrow">GUIA DA PARTIDA</span><h2 id="tutorialTitulo">Como jogar</h2><div id="textoTutorial"></div></section></div>
<section class="table-layout">
  <aside class="players-rail card"><div class="rail-head"><span class="eyebrow">MESA</span><strong>Jogadores</strong></div><div id="listaParticipantes"></div></aside>
  <section class="board-wrap"><div class="board card"><div class="board-top"><div><span class="eyebrow" id="faseLabel">RODADA</span><strong id="infoRodada">—</strong></div><div class="turn-banner" id="mensagemJogo">Carregando partida…</div><div><span class="eyebrow">APOSTA / POTE</span><strong id="infoAposta">—</strong></div></div><div id="dealerArea" class="dealer-area"></div><div id="mesaExtra" class="mesa-extra"></div><div id="cartasMesa" class="table-cards"></div></div>
    <div class="hand-panel card"><div class="hand-head"><div><span class="eyebrow">SUA MÃO</span><strong id="handHelp">Escolha uma carta</strong></div><button id="btnOrganizar" class="btn btn-secondary small">Organizar</button></div><div id="minhasCartas" class="cards-hand"></div></div>
    <div class="action-bar card"><div class="actions-main"><button id="btnComprar" class="btn btn-primary">Comprar carta</button><button id="btnPassar" class="btn btn-secondary">Passar</button><button id="btnComprarDescarte" class="btn btn-secondary escondido">Pegar descarte</button><button id="btnBaixar" class="btn btn-secondary escondido">Baixar jogo</button></div><div id="controlesTruco" class="actions-extra escondido"><button data-pedido="3" class="btn btn-secondary">Truco</button><button data-pedido="6" class="btn btn-secondary">6</button><button data-pedido="9" class="btn btn-secondary">9</button><button data-pedido="12" class="btn btn-secondary">12</button></div><div id="respostasTruco" class="actions-extra escondido"><button id="btnAceitarTruco" class="btn btn-primary">Aceitar</button><button id="btnAumentarTruco" class="btn btn-secondary">Aumentar</button><button id="btnRecusarTruco" class="btn btn-secondary">Correr</button></div></div>
    <div class="bottom-actions"><button id="btnNovaRodada" class="btn btn-primary escondido">Nova rodada</button><button id="btnTrocarJogo" class="btn btn-secondary">Voltar para a sala</button></div>
  </section>
  <aside class="score-rail card"><span class="eyebrow">PLACAR</span><div id="listaPlacar" class="score-list"></div><div class="score-hint">O placar é atualizado em tempo real para todos na sala.</div></aside>
</section>
</main><script type="module" src="js/jogo.js?v=final2"></script><script src="js/tutorial.js?v=final2"></script></body></html>
